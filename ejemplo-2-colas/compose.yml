# ============================================================
# Docker Compose para el Ejemplo 2: Idempotencia con Kafka
# ============================================================
# Arquitectura:
#   java-producer → Kafka → go-consumer
#   go-consumer   → Kafka → java-producer (respuesta)
#
# El servicio Java envía solicitudes de pago a Kafka.
# Si no recibe respuesta en 5 segundos, reintenta con
# la MISMA clave de idempotencia.
# El servicio Go consume los mensajes, verifica si ya
# fueron procesados, y solo los procesa UNA vez.
# ============================================================

services:

  # ---- Zookeeper: requerido por Kafka para la coordinación ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ---- Kafka: broker de mensajería ----
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners internos (para contenedores) y externos (para host)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Crear automáticamente los topics necesarios
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ---- Servicio Java (Productor): envía solicitudes de pago ----
  java-producer:
    build:
      context: ./java-producer
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka

  # ---- Servicio Go (Consumidor): procesa pagos con idempotencia ----
  go-consumer:
    build:
      context: ./go-consumer
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka

  # ---- Frontend React: interfaz para enviar pagos ----
  frontend-kafka:
    build:
      context: ./frontend-kafka
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - java-producer
