server:
  port: 8082

spring:
  application:
    name: payment-service

  # Configuracion de H2 (base de datos en memoria)
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA: crear tablas automaticamente desde las entidades
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Habilitar consola web de H2 para inspeccionar la BD
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Eureka Client: registrarse en el servidor de descubrimiento
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
